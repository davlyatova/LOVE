<section class="section" id="apply">
  <div class="container">
    <div class="section__head section__head--center">
      <h2 class="section__title">Оставить заявку</h2>
      <p class="section__sub">7 дней премиум-доступа бесплатно. Менеджер свяжется с вами.</p>
    </div>

    <!-- Добавили method="POST" -->
    <form class="apply-form" id="applyForm" method="POST" action="">
      {% csrf_token %} <!-- Защита Django от CSRF-атак -->
      
      <div class="apply-form__row">
        <input type="text" name="name" placeholder="Имя" required />
        <input type="tel" name="phone" placeholder="Телефон" required />
      </div>
      <input type="email" name="email" placeholder="Email" required />
      <textarea name="comment" rows="3" placeholder="Комментарий (необязательно)"></textarea>
      
      <label class="apply-check">
        <input type="checkbox" name="agree" required />
        <span>Согласен с обработкой персональных данных</span>
      </label>
      
      <button type="submit" class="btn btn--primary"><i class="fas fa-paper-plane"></i> Отправить заявку</button>
    </form>
  </div>
</section>

<style>
  .apply-form { max-width: 520px; margin: 0 auto; display: grid; gap: 16px;
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px; padding: 32px; }
  .apply-form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .apply-form input, .apply-form textarea { width: 100%; padding: 13px 16px;
  border-radius: 12px; color: #fff; background: rgba(14,20,32,.6);
  border: 1px solid rgba(255,255,255,.1); font: inherit; font-size: 15px; }
  .apply-form textarea { resize: vertical; }
  .apply-form ::placeholder { color: rgba(255,255,255,.35); }
  .apply-form input:focus, .apply-form textarea:focus { outline: none;
  border-color: #e50914; box-shadow: 0 0 0 3px rgba(229,9,20,.18); }
  .apply-check { display: flex; align-items: center; gap: 10px; cursor: pointer;
  font-size: 14px; color: rgba(255,255,255,.7); }
  .apply-check input { width: 18px; height: 18px; accent-color: #e50914; }
  .apply-form .btn { justify-content: center; }
  @media (max-width: 520px) { .apply-form__row { grid-template-columns: 1fr; } }
</style>
